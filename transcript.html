<style>
  /* The transcript alone, synced to the audio. Same physical situation as the
     main wall (see CLAUDE.md §2): a pure white field, black Times, every
     control that affects appearance on a live slider because the room decides.
     One column that moves under a fixed reading line, so the voice speaking
     now always sits in the same place on the wall. */
  :root {
    --ink: #000;
    /* ~30px at 1920 wide, ~18px on a phone, capped for 4K. The size slider
       overrides this with a fixed px value once it is touched. */
    --size: clamp(17px, 0.78vw + 15px, 44px);
    --lead: 1.3;
    --dir: 0.78;          /* stage directions: the apparatus tier, as notes are on the wall */
    --measure: 32;        /* column width in em */
    --line: 0.38;         /* reading line, as a share of the height */
    --past: 0.30;
    --future: 0.14;
    --pad: 6vw;
    --feather: 0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; background: #fff; overflow: hidden;
    font-family: "Times New Roman", Times, "Liberation Serif", serif;
    -webkit-font-smoothing: antialiased; cursor: none;
  }
  body.pointing { cursor: default; }

  /* Text dissolves into the field at the top and bottom edges rather than
     being cut by them. This is a mask on what is drawn, not an alpha channel
     on the output — the projector still receives an opaque white image. */
  #stage {
    position: fixed; inset: 0; background: #fff; overflow: hidden;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 10%, #000 86%, transparent 100%);
            mask-image: linear-gradient(to bottom, transparent 0, #000 10%, #000 86%, transparent 100%);
  }
  #track {
    position: absolute; top: 0; left: 50%;
    width: min(calc(var(--measure) * 1em), calc(100vw - 2 * var(--pad)));
    font-size: var(--size); line-height: var(--lead); color: var(--ink);
    will-change: transform;
  }
  /* padding, never margin, so offsetHeight is the whole block (CLAUDE.md §5) */
  .it {
    padding: 0 0 0.55em 0;
    text-align: justify; hyphens: auto; -webkit-hyphens: auto;
    white-space: pre-line;          /* keeps the prayer's verse breaks */
    opacity: var(--future);
  }
  .it.verse { text-align: left; }
  /* Justification needs measure (CLAUDE.md §6). Below ~24em — a phone, or the
     column slider pulled in — justified lines open rivers, worst where the
     browser has no hyphenation dictionary, so the column sets ragged right. */
  #track.ragged .it { text-align: left; }
  .it.verse .who { display: block; }
  .who { font-weight: 700; }
  .who i { font-style: normal; font-weight: 400; }   /* "(singing)" is a note, not a name */
  .dir { font-size: calc(var(--dir) * 1em); padding-bottom: 0.75em; }

  #fs {
    position: fixed; right: var(--pad); bottom: 2vh; z-index: 50;
    border: 0; background: none; padding: 6px 2px;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
    color: #999; cursor: pointer;
    opacity: 0; pointer-events: none; transition: opacity 0.25s;
  }
  body.pointing #fs { opacity: 1; pointer-events: auto; }

  .feather { position: fixed; inset: 0; pointer-events: none; mix-blend-mode: multiply; }
  #fx { background: linear-gradient(to right, #000 0%, transparent calc(var(--feather)*1%), transparent calc(100% - var(--feather)*1%), #000 100%); }
  #fy { background: linear-gradient(to bottom, #000 0%, transparent calc(var(--feather)*1%), transparent calc(100% - var(--feather)*1%), #000 100%); }
  body.noFeather .feather { display: none; }

  #gate {
    position: fixed; inset: 0; background: #fff; z-index: 40;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; font-size: 12px; letter-spacing: 0.1em;
  }
  #gate.off { display: none; }
  #gate .big {
    font-family: "Times New Roman", Times, "Liberation Serif", serif;
    font-size: var(--size); line-height: var(--lead);
    letter-spacing: 0; text-transform: none; color: var(--ink);
    text-decoration: underline; text-underline-offset: 0.18em;
    text-decoration-thickness: 1px; cursor: pointer;
  }
  #gate .big:hover { text-decoration: none; }
  #gate .hint { color: #888; letter-spacing: 0.04em; max-width: 30em; text-align: center; line-height: 1.7; padding: 0 1.5em; overflow-wrap: anywhere; }
  #gate input[type=file] { display: none; }
  body.dragging #gate { background: #eee; }

  #panel {
    position: fixed; top: 0; right: 0; width: 320px; max-width: 100vw; height: 100%;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    background: #f4f4f4; border-left: 1px solid #ddd; padding: 20px;
    overflow-y: auto; font-size: 12px; color: #111; z-index: 60;
    transform: translateX(100%); transition: transform 240ms ease;
  }
  #panel.open { transform: translateX(0); }
  #panel h2 { font-size: 10px; text-transform: uppercase; letter-spacing: 0.14em; font-weight: 500; color: #666; margin-bottom: 14px; }
  #panel label { display: block; margin: 12px 0 4px; font-size: 11px; color: #555; }
  #panel input[type=range] { width: 100%; }
  #panel button { width: 100%; padding: 8px; margin-top: 8px; background: #fff; color: #000; border: 1px solid #bbb; font-family: inherit; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; }
  .note { margin-top: 16px; padding-top: 12px; border-top: 1px solid #ddd; color: #777; line-height: 1.6; font-size: 11px; }
  kbd { background: #e4e4e4; padding: 1px 4px; font-size: 10px; font-family: inherit; }
</style>

  const TURNS = /*TURNS*/[{"kind":"turn","spk":"Andriy","text":"Let’s go…","start":3.5,"end":4.9},{"kind":"turn","spk":"Frania","text":"Home, Hek.","start":15.6,"end":16.9},{"kind":"dir","text":"[sounds of tableware, chairs moving, indistinct chatter]","start":16.9,"end":92.0},{"kind":"turn","spk":"Bohdan’s mother","text":"...our dinner will be unconventional…while we reminisce about him, we will watch videos from his life... [indistinct]... we won’t cry; instead, we’ll be as cheerful and life-loving as our son was...","start":92.0,"end":108.0},{"kind":"turn","spk":"Frania","text":"Home!","start":107.5,"end":108.9},{"kind":"turn","spk":"Serhii","text":"Yes, hold on. Plastic surgery of a medial surface defect of the foot.","start":109.7,"end":115.76},{"kind":"turn","spk":"Bohdan’s sister","text":"We all know what he was like... [indistinct]... he’d be trying to cheer us up right now...","start":116.0,"end":119.7},{"kind":"turn","spk":"Serhii","text":"Reconstruction of a flap from the dorsum of the foot.","start":125.9,"end":133.85},{"kind":"turn","spk":"Frania","text":"Home!","start":134.3,"end":135.3},{"kind":"turn","spk":"Serhii","text":"Do you have a copy, perhaps?","start":136.61,"end":138.64},{"kind":"turn","spk":"Bohdan’s sister","text":"...when he was just a child, how he grew up, how he matured. We’ll be watching all these stages, remembering him. And as we look at him...","start":143.76,"end":150.9},{"kind":"turn","spk":"Serhii","text":"Well, I'll finish writing it up. A raised dorsal flap, next…","start":159.78,"end":167.82},{"kind":"turn","spk":"Nikolaich","text":"Fields? Yeah, the thing is, the guy who hired me—he was working as an agronomist—stepped on a mine. I helped load him into the ambulance myself... [indistinct]... He was trying to find a better way out... A tractor passed that way, but on the way back it didn’t make it. The blast, fuck, you could hear it from like eight kilometers away…","start":180.5,"end":224.22},{"kind":"turn","spk":"Serhii","text":"Homeostasis, next... Anyway, I’ll write all of it down.","start":229.2,"end":233.0},{"kind":"turn","spk":"Nikolaich","text":"Left leg was gone, the arm was shattered... [indistinct] tied it off with a tourniquet.","start":233.0,"end":244.0},{"kind":"turn","spk":"Sania","text":"A film about Kyiv, about real life, none of that watered-down stuff!","start":258.0,"end":262.0},{"kind":"turn","spk":"Serhii","text":"Thank you!","start":278.58,"end":279.3},{"kind":"turn","spk":"Nikolaich","text":"...the second one died instantly. Hell of a guy, an accordion player—everyone knew him.","start":283.24,"end":293.38},{"kind":"turn","spk":"Hek","text":"Rushing straight into the fire like a firefighter, finding the courage! Showing up at their station to put out the blaze! Rushing into real fire and then extinguishing it from the ladder!","start":293.44,"end":312.18},{"kind":"turn","spk":"Frania","text":"Grandpaaaaa!","start":312.2,"end":313.5},{"kind":"turn","spk":"Chapa","text":"Just brutal. So, the unit he was in, in the 47th, went to Orikhiv. They were, like, far from the zero line. Well, not too far—around fifteen kilometers. They were sitting in a basement, at headquarters. And a damn 500 kg bomb hit that place—a Shahed carries 50 kg—and it blew everything to hell. Guys, the whole place. Only two people made it out alive. And we, with one of the guys…","start":312.52,"end":339.9},{"kind":"turn","spk":"Mrs. Anya","text":"No-no, you can’t go there! This way, sweetheart.","start":339.05,"end":341.5},{"kind":"turn","spk":"Chapa","text":"...at the very beginning of all this, we volunteered with Fleet5. And he was like, “So? You ready? Gonna go?”—“Nah, not yet.”—“Well, I’m ready. I’m going.” And now, yesterday, he fucking died under the rubble.","start":340.16,"end":354.76},{"kind":"dir","text":"[Indistinct]","start":354.76,"end":358.0},{"kind":"turn","spk":"Patient","text":"...in a pit, at the torture site. After the torture... [indistinct]","start":358.0,"end":362.6},{"kind":"turn","spk":"Serhii","text":"After the torture—you mean after captivity?","start":362.68,"end":364.62},{"kind":"turn","spk":"Patient","text":"While in captivity! They chucked me in the pit after, like, torturing—with the taser. Wanted me to say “Glory to Russia.”","start":365.14,"end":375.2},{"kind":"turn","spk":"Serhii","text":"Okay, and what are your complaints now?","start":380.0,"end":381.8},{"kind":"turn","spk":"Another patient","text":"About the katsaps!","start":381.84,"end":382.74},{"kind":"turn","spk":"Serhii","text":"Well, that’s the main complaint for all of us these days.","start":384.04,"end":386.08},{"kind":"turn","spk":"Woman at the Liquor Factory","text":"I want them to build a children’s Disneyland here! And a waterpark. I’ve dreamt about it for 20 years. Believe me, the whole of Europe will come here—we’ll feed them Ukrainian dishes…","start":386.1,"end":397.0},{"kind":"turn","spk":"Serhii","text":"Does it pull, hurt, burn? What’s the sensation?","start":391.46,"end":393.5},{"kind":"turn","spk":"Patient","text":"Just aches a bit.","start":394.38,"end":395.32},{"kind":"turn","spk":"Woman at the Liquor Factory","text":"And we’ll sing Oy tam na tovchku, na bazari...","start":395.32,"end":401.37},{"kind":"turn","spk":"Hek and Frania’s grandpa","text":"No, no—the small distillery has to stay! (laughs)","start":401.37,"end":407.82},{"kind":"turn","spk":"Woman at the Liquor Factory","text":"I’m begging you—hear me out! Let there be a Ukrainian Disneyland!","start":407.82,"end":416.37},{"kind":"turn","spk":"Serhii","text":"Aside from that—anything else? Just this, yeah?","start":416.37,"end":418.9},{"kind":"dir","text":"[Indistinct]","start":418.9,"end":453.22},{"kind":"turn","spk":"Serhii","text":"I’m guessing it went pretty deep? There’s a ton of nerves and arteries in there. Easy to make things worse—but we’ll try to clean it up carefully.","start":453.22,"end":459.18},{"kind":"turn","spk":"Mrs. Anya","text":"...about 90 kilometers before Lviv—I always forget the name of that little town—anyway, she says, “Go there, there’s a big two-story house.” Grandma says her younger sister studied medicine there, finished her master’s. And I say, “Alright then!” So we got in a taxi, went there, and stayed for a bit over two months.","start":480.7,"end":506.1},{"kind":"turn","spk":"Serhii","text":"Okay, everything written here is correct? Form 100. Injury received while on active duty on December 4th, in the combat zone, as a result of mortar shelling. First aid was provided during evacuation stages, from the 5th to the 9th at Novomoskovsk Central District Hospital in Dnipropetrovsk Oblast. Then transferred for surgery in Khmelnytskyi... Any serious illnesses before this? Any surgeries, apart from the injury?","start":506.62,"end":538.84},{"kind":"turn","spk":"Mrs. Anya","text":"Oh, thank you! (laughs)","start":539.0,"end":540.4},{"kind":"turn","spk":"Serhii","text":"And now, function-wise—is everything working? Can you move it in and out? Is the sensation still there? [indistinct]","start":541.98,"end":547.62},{"kind":"turn","spk":"Tour guide","text":"...certain barriers that grow between us...","start":547.62,"end":550.6},{"kind":"turn","spk":"Vitalii Hodziatskyi","text":"The symphony he wrote right after Leningrad—yes, that one—it has this invasion motif\ntam-tam, ta-ram-tam, tam-tam-ta-ram, you know the one. He wrote it in 1941, about the fascists. And here…","start":568.84,"end":589.06,"lines":[568.84,572.94]},{"kind":"turn","spk":"Serhii","text":"Hepatitis? Kidney disease? Type 1 diabetes? Ischemic or hypertensive conditions? Peptic ulcers?","start":607.82,"end":616.46},{"kind":"turn","spk":"Zenon","text":"...the skin tissue, the limb—it’ll start to die, and then they’ll have to amputate. But if you realize there’s a chance, they pack the wound, wrap it up with special gauze dressings, and then, if there’s no bleeding, they slowly start to loosen the tourniquet, and then… the limb can be saved.","start":616.46,"end":645.89},{"kind":"turn","spk":"Serhii","text":"Any peeling, chafing, stretch marks on the skin? Rashes?","start":652.18,"end":657.34},{"kind":"turn","spk":"Serhii","text":"Probably for safety. I mean, evolutionarily speaking, it’s just how it developed…","start":691.78,"end":697.4},{"kind":"turn","spk":"Katya","text":"No, I just... My husband was wounded. Instant death. As I understand it—the aorta…","start":697.88,"end":708.2},{"kind":"turn","spk":"Serhii","text":"A very rapid drop in circulating blood volume. I mean, technically, under the right conditions, you can do something. But it has to be fast. Really precise. Like, apply a tourniquet or even a stick, anything—just not too tight, to not crush the arm…","start":708.1,"end":740.72},{"kind":"turn","spk":"Katya","text":"No, it was below the collarbone. The wound was somewhere here.","start":741.2,"end":745.6},{"kind":"turn","spk":"Serhii","text":"Ah. I don’t know, I mean, there are cases where people survive, it’s possible, but [indistinct] ...also very fast. But in that case, they reacted very well—they packed the wound, clamped it—and at the field hospital there happened to be a vascular surgeon on rotation, and another good surgeon too—together they saved his life.","start":745.72,"end":793.25},{"kind":"turn","spk":"Katya","text":"Just a stroke of luck, really.","start":793.25,"end":794.83},{"kind":"turn","spk":"Serhii","text":"Yeah, yeah. Exceptionally lucky. Usually, you’ve got like a minute—and that’s it.","start":794.85,"end":800.0},{"kind":"turn","spk":"Katya","text":"And that’s it, yeah?","start":800.1,"end":800.55},{"kind":"turn","spk":"Serhii","text":"You have about 10 seconds to do something. And in combat—that’s often just not realistic.","start":800.55,"end":808.33},{"kind":"turn","spk":"Katya","text":"He was out on a mission.","start":808.46,"end":809.76},{"kind":"turn","spk":"Serhii","text":"Well, if there is active combat work, then…","start":810.37,"end":815.6},{"kind":"turn","spk":"Katya","text":"My husband was a sapper. They were working, almost done with the job. Had to clear the mines so the vehicles could get through. Infantry went first, then it was them, sweeping—and then the tech would roll in. And they were just about done—and then it hit. There was probably a tank somewhere nearby—no sound, nothing. No time to duck. He was with another guy—that one got a concussion.","start":830.12,"end":871.32},{"kind":"turn","spk":"Serhii","text":"Sounds like he couldn’t help—no one else was nearby.","start":869.77,"end":877.85},{"kind":"turn","spk":"Katya","text":"Yeah. And my husband—he stood up and... and... collapsed.","start":877.5,"end":880.4},{"kind":"turn","spk":"Serhii","text":"Damn.","start":881.6,"end":882.3},{"kind":"turn","spk":"Katya","text":"Goddamn war.","start":898.4,"end":899.74},{"kind":"turn","spk":"Soldier","text":"To prayer.","start":917.0,"end":918.4},{"kind":"turn","spk":"Soldier and choir of soldiers","text":"Ukraine, holy mother of heroes, come into my heart.\nCome as a storm of the Caucasian wind,\nthe murmur of the Carpathian streams,\nThe battles of the glorious Conqueror, Father Khmel,\nthe triumph and thunder of the guns of revolution,\nthe joyful chime of St. Sophia’s bells.\nLet my soul be reborn in You,\nlet it be illumined by Your glory,\nfor You, Most Holy, are my whole life,\nfor You are all my happiness.\nRing for me with the clatter of shackles,\nwith the creak of gallows in the somber dawns.\nBring me the cries of those tortured in cellars, in prisons, and in exile,\nso that my faith may be granite,\nso that the strength of my resolve may grow,\nso that I may go bravely into battle—\nas Your heroes went before me—\nfor Your glory, for Your sacred ideals;\nto avenge the shame of bondage, the trampled honor,\nthe scorn of Your tormentors,\nthe innocent blood of Your murdered children,\nthe noble deaths of the heroes of the Ukrainian nation,\nand of thousands more, unknown to us,\nwhose bones lie scattered or secretly buried.\nBurn away all frailty in my heart with life-giving fire.\nLet me know neither fear nor doubt.\nstrengthen my spirit,\ntemper my will,\ndwell within my heart!\nRaise me to deeds of clarity and courage,\nand in those deeds let me find my death—\na sweet death in torment for You.\nAnd I shall dissolve within You\nand live forever in You,\neternal Ukraine—holy, mighty, united.","start":921.53,"end":1070.64,"lines":[921.53,929.19,933.21,936.69,941.68,945.9,950.49,954.7,958.31,962.41,967.82,970.2,973.97,981.55,985.61,988.81,992.21,996.29,1000.83,1006.92,1009.16,1013.78,1018.72,1022.68,1027.96,1034.11,1040.78,1042.8,1044.46,1047.5,1050.9,1055.06,1058.7,1061.7,1064.86]},{"kind":"turn","spk":"Soldier","text":"Glory to Ukraine!","start":1071.28,"end":1072.42},{"kind":"turn","spk":"Choir","text":"Glory to the heroes!","start":1072.42,"end":1073.52},{"kind":"turn","spk":"Soldier","text":"Glory to the nation!","start":1073.53,"end":1074.55},{"kind":"turn","spk":"Choir","text":"Death to the enemies!","start":1074.57,"end":1075.59},{"kind":"turn","spk":"Soldier","text":"Ukraine!","start":1075.6,"end":1076.4},{"kind":"turn","spk":"Choir","text":"Above all!","start":1076.46,"end":1077.38},{"kind":"turn","spk":"Soldier","text":"Ukraine!","start":1077.52,"end":1078.3},{"kind":"turn","spk":"Choir","text":"Above all!","start":1078.3,"end":1079.1},{"kind":"turn","spk":"Soldier","text":"Ukraine!","start":1079.28,"end":1080.06},{"kind":"turn","spk":"Choir","text":"Above all!","start":1080.06,"end":1080.84},{"kind":"turn","spk":"Commander","text":"But I want to talk about the last day. [Indistinct] ... most likely, it will not end well. The unit that went on this mission consisted solely of volunteers who made this decision for themselves—because they were the best-trained people in this unit, the most combat-ready people, and only they could carry out this task. During the battle that ensued during the exit, Kostya was wounded, holding the fight for fifteen minutes before that. And I will say that if not for Kostya’s actions, I would be very sorry, but I doubt that I could be here. His actions, his training, his maximalism, and his desire to be the best, allowed all of us to get out of there. All of us who did.","start":1084.27,"end":1157.97},{"kind":"turn","spk":"Kostya","text":"Ha—and the tigers fell at my feet! Ha…","start":1157.97,"end":1160.5},{"kind":"turn","spk":"Commander","text":"Through Kostya’s sacrifice, seventeen people made it out alive. Unfortunately, we lost our brother, but we saved seventeen lives—because of Kostya. I am proud to have known him as a warrior. He was the best soldier in this unit—the best I’ve met in my entire life. Brother... to live as a warrior is to live forever.","start":1158.2,"end":1188.32},{"kind":"turn","spk":"Funeral hostess","text":"So, dear ones, the time for farewells has come. And... last to go will be those closest...","start":1200.71,"end":1212.8},{"kind":"turn","spk":"Hek","text":"Dad, today you're at the stone factory! At the stone factory!","start":1212.92,"end":1219.64},{"kind":"turn","spk":"Funeral hostess","text":"...Alright, come forward to say your goodbyes.","start":1219.96,"end":1225.58},{"kind":"turn","spk":"Hek","text":"Here, they press stones of one type into one single lump. See? They compress all the rocks, from one type of waste stone. See, they’re all getting pressed together.","start":1225.6,"end":1234.1},{"kind":"turn","spk":"Liokha","text":"Yeah, yeah—that was us there. Our 135th and [indistinct] .","start":1234.12,"end":1239.53},{"kind":"turn","spk":"Ian","text":"That was the end of winter, right?","start":1239.54,"end":1240.6},{"kind":"turn","spk":"Liokha","text":"Ours held the line: two weeks—a hundred guys. Then another group, fifty guys, held it for five days. The last ones, they were near “the Plane,” maybe you heard? That’s where the “Garages” were, that was ours too. The “Garages”—those were ours. So in the end, we held them for three weeks, and they…","start":1240.6,"end":1265.1},{"kind":"turn","spk":"Kostya","text":"Let’s go, guys, keep working!","start":1265.1,"end":1267.1},{"kind":"turn","spk":"Liokha","text":"Six taken prisoner—fuck…","start":1267.7,"end":1271.3},{"kind":"turn","spk":"Hek","text":"Look, Dad, stop right there!","start":1271.0,"end":1273.0},{"kind":"turn","spk":"Liokha","text":"...five killed, thirty wounded…","start":1273.02,"end":1278.72},{"kind":"turn","spk":"Hek","text":"Look, Dad, a little cross!","start":1279.2,"end":1282.4},{"kind":"turn","spk":"Liokha","text":"...and sixty concussed, out of 150 people. You know what a concussion is? I don’t know, maybe people don’t know, it’s a brain jolt…","start":1282.52,"end":1290.18},{"kind":"turn","spk":"Hek","text":"Here lie the treasures of Captain Buger!","start":1290.3,"end":1292.6},{"kind":"turn","spk":"Liokha","text":"...10% skull torsion. Like, you hear “concussion,” and it sounds mild—but really, it’s fucked: blood pressure at 200, splitting headaches, and early old age. That’s the outlook. Not a pretty one. I even started thinking about joining the snipers.","start":1292.22,"end":1318.4},{"kind":"turn","spk":"Ian","text":"You think you can?","start":1317.73,"end":1321.1},{"kind":"turn","spk":"Frania (reacting to the air raid siren)","text":"Oh, the pooooolice!","start":1320.0,"end":1321.6},{"kind":"turn","spk":"Liokha","text":"I mean, I’m an instructor—I know everyone. And my buddy, he’s the commander of the sniper unit. So I started thinking, maybe I should go join the snipers, since I’m going back anyway. But here’s the problem: I can’t see shit. You gotta line up the sights, and I can’t do it without glasses, you know?","start":1321.2,"end":1343.0},{"kind":"turn","spk":"Ian","text":"Ah, so your eyesight’s fucked, huh?","start":1344.24,"end":1346.2},{"kind":"turn","spk":"Liokha","text":"Yeah, I gotta wear glasses for that stuff (laughs). I shoot okay, but I can’t make out all the angles, and with that kind of shooting, you need precise adjustments…","start":1347.18,"end":1358.92},{"kind":"turn","spk":"Hek","text":"Dad, lift this rock! Oh, it’s dirt! There’s dirt, sand, and branches here.","start":1358.45,"end":1370.5},{"kind":"turn","spk":"Liokha","text":"So I was thinking maybe I should go as a marksman, just straight up, fuck it.","start":1361.38,"end":1368.78},{"kind":"turn","spk":"Ian","text":"What’s that?","start":1370.9,"end":1372.1},{"kind":"turn","spk":"Liokha","text":"Look, there’s snipers, right? They camp out for two, three days. But a marksman, he moves with the group...","start":1373.28,"end":1381.82},{"kind":"dir","text":"[Indistinct—prayer, funeral chant]","start":1381.82,"end":1426.5},{"kind":"turn","spk":"Priests","text":"Christ is risen from the dead! By death He conquered death, and to those in the graves, He granted life. Christ is risen!","start":1426.5,"end":1459.2},{"kind":"turn","spk":"Congregation","text":"Truly, He is risen.","start":1459.2,"end":1466.6},{"kind":"turn","spk":"Priests","text":"Christ is risen from the dead! By death He conquered death, and to those in the graves, He granted life.","start":1467.4,"end":1495.0},{"kind":"dir","text":"[Indistinct]","start":1495.0,"end":1531.0},{"kind":"turn","spk":"Ruslan","text":"So here’s the deal: there’s the hoof, and it’s important to make sure there are no gaps, no moisture gets in, so the foot doesn’t start to rot. You’ve got to fit the sole exactly—it has to hug the whole contour of the hoof perfectly. And you know, especially when they take off the old hoof, it’s actually so nice to see the foot.","start":1531.0,"end":1549.5},{"kind":"turn","spk":"Ian","text":"No way! I had no idea.","start":1550.88,"end":1554.7},{"kind":"turn","spk":"Ruslan","text":"You can’t even imagine how they change them, right?","start":1553.86,"end":1556.46},{"kind":"turn","spk":"Ian","text":"Never even thought about it.","start":1556.98,"end":1559.18},{"kind":"turn","spk":"Ruslan","text":"I’ll show you.","start":1559.18,"end":1559.92},{"kind":"turn","spk":"Levin","text":"And right here he’s got a windmill by Maria Prymachenko, and here, a trident, drawn by a neural network.","start":1562.25,"end":1575.5},{"kind":"turn","spk":"Ian","text":"Are you the only artist who ever tattooed him?","start":1581.2,"end":1584.7},{"kind":"turn","spk":"Levin","text":"Yeah, yeah. And you know, what made Bohdan really stand out was how he squealed during the sessions—no one squealed like that. I’d give him a full hour of anesthetic, all the stuff, all the bullshit, and still—“kheeeeeeeh!” It was iconic. Totally unforgettable.","start":1584.77,"end":1607.26},{"kind":"turn","spk":"Ian","text":"I mean, for real, it hurts.","start":1609.98,"end":1611.16},{"kind":"turn","spk":"Levin","text":"Yeah, you’re getting jabbed with a fucking needle.","start":1611.64,"end":1614.62},{"kind":"turn","spk":"Kostya","text":"Kitty-kitty, come here, come, little one! Come here, oh you’re so nice, oh you’re so small, oh come here to me. My little one, ah, kitty-kitty-kitty.","start":1637.6,"end":1652.19},{"kind":"turn","spk":"Kostya","text":"I made it here! Thought I’d be climbing up that slope, but nope, the road leads this way. We’ll see what’s ahead. And now I go that way!","start":1663.9,"end":1688.96},{"kind":"dir","text":"[Indistinct]","start":1688.96,"end":1690.75},{"kind":"turn","spk":"Hek","text":"Dima, we’re sorting through stuff! We’re sorting!","start":1690.75,"end":1693.3},{"kind":"turn","spk":"Dima","text":"Got it, Hek. Frania, is this yours or what?","start":1696.5,"end":1705.75},{"kind":"turn","spk":"Hek","text":"We’re sorting this stuff out.","start":1707.5,"end":1710.3},{"kind":"turn","spk":"Dima","text":"I hauled so many chairs at my station (laughs). Go ahead, see what you can make of these.","start":1742.4,"end":1756.6},{"kind":"turn","spk":"Hek","text":"I’ll take this to the car, and you stack this here... He went that way... Dad! The main flag of Ukraine! Dad, there’s the main flag of Ukraine—come, I’ll show you. Dima, come on, I’ll show you the main flag of Ukraine!","start":1757.0,"end":1786.28},{"kind":"turn","spk":"Dima","text":"Alright, we’re about to head out, and you’ll show me.","start":1787.08,"end":1789.14},{"kind":"turn","spk":"Priests","text":"Lord, have mercy. Lord, have mercy.","start":1789.5,"end":1793.3},{"kind":"dir","text":"[The Ukrainian national anthem plays. Then, a funeral bugle call. A priest speaks faintly in the background.]","start":1793.3,"end":1961.0},{"kind":"turn","spk":"Commander","text":"Line up! Attention! Raise the State Flag over the fallen Senior Soldier Hennadiy Kolesnyk.","start":1961.0,"end":1974.5},{"kind":"dir","text":"[Bugle call]","start":1974.5,"end":2028.0},{"kind":"dir","text":"[Indistinct: Ruslan and Ian speaking faintly]","start":2028.0,"end":2078.88},{"kind":"turn","spk":"Commander","text":"Dear friends, family, and comrades of the fallen hero of Ukraine, Hennadiy Kolesnyk—today, we bid farewell to a warrior who gave the most precious thing he had for our country: his life. But it is precisely thanks to warriors like Hennadiy that Ukraine has existed, exists, and will continue to exist. It is men like Hennadiy who have been, are, and will always be the finest sons of our nation. We must remember this, we must honor it, and we must do everything within our power to ensure that Hennadiy’s sacrifice was not in vain. We must do everything we can to bring our victory closer—a victory that will surely come...Glory to Ukraine!","start":2078.88,"end":2141.0},{"kind":"turn","spk":"Crowd","text":"Glory to the heroes!","start":2141.6,"end":2142.9},{"kind":"turn","spk":"Commander","text":"Dear family... On behalf of the command of the Third Assault Brigade, I ask you to accept this flag.","start":2201.9,"end":2206.5},{"kind":"turn","spk":"Priest","text":"Today, we are gathered to honor the remarkable figure of a defender of Ukraine: our comrade, a son of his nation, a son of his family. And anyone who holds great love for his memory, his heroism, and his dignity may come forward to speak words of farewell, of gratitude, of love…","start":2212.2,"end":2260.0},{"kind":"turn","spk":"Ian","text":"...and everyone was so relieved that, by sheer luck, he didn’t end up in Mariupol…","start":2284.7,"end":2292.9},{"kind":"turn","spk":"Sasha (singing)","text":"Like that honey, like that honey, sweet as honey... Better look at him who, at him who…","start":2355.0,"end":2412.6},{"kind":"turn","spk":"Frania","text":"Who’s knocking?","start":2414.2,"end":2415.5},{"kind":"turn","spk":"Sasha","text":"Better look at him…","start":2417.4,"end":2438.0},{"kind":"turn","spk":"Katya","text":"I mean, that’s all that’s left... Just the phone numbers. All the photos, the messages, they got wiped.","start":2483.1,"end":2492.2},{"kind":"dir","text":"[In the background]","start":2492.2,"end":2494.3},{"kind":"turn","spk":"Frania","text":"Mister Poopoo!","start":2494.3,"end":2495.1},{"kind":"turn","spk":"Ian","text":"iPhones have this thing...","start":2522.0,"end":2524.1},{"kind":"turn","spk":"Katya","text":"A backup?","start":2524.6,"end":2526.3},{"kind":"turn","spk":"Ian","text":"No, I mean, there’s a setting, like, to wipe it or not if you enter the wrong password too many times.","start":2526.4,"end":2531.3},{"kind":"turn","spk":"Katya","text":"Ah, yeah, maybe that’s what happened here too. Or maybe I pressed something by accident.","start":2531.7,"end":2537.7},{"kind":"turn","spk":"Ian","text":"Could it have been wiped remotely?","start":2537.6,"end":2538.4},{"kind":"turn","spk":"Katya","text":"No. When I tried to turn it on—I got the password wrong a few times—there was still that photo of Platoshka on the lock screen.","start":2538.1,"end":2549.4},{"kind":"dir","text":"[In the background]","start":2546.6,"end":2547.0},{"kind":"turn","spk":"Hek","text":"These are the bad robot Transformers!!","start":2547.0,"end":2548.2},{"kind":"turn","spk":"Zhanna","text":"Are they very scary?","start":2548.2,"end":2548.85},{"kind":"turn","spk":"Platon","text":"Yeah! They’re destroying the city!","start":2548.85,"end":2549.95},{"kind":"turn","spk":"Zhanna","text":"Whoa, then we’ve got to stop them!","start":2549.95,"end":2551.0},{"kind":"turn","spk":"Katya","text":"Honestly, with Berdiansk... every little street there is tied to Hena. It’s all Hena, it’s our life.","start":2551.64,"end":2560.0},{"kind":"turn","spk":"Ian","text":"Of course.","start":2559.9,"end":2560.9},{"kind":"turn","spk":"Katya","text":"It’s our feelings, our emotions, our memories. That kitchen garden—Hena planted it for Platon. I mean, I don’t think they’ll let us back there... but it’s part of our life.","start":2560.31,"end":2577.9},{"kind":"turn","spk":"Hek","text":"They’re smashing the city! Zhanna can’t hold them off!!","start":2569.36,"end":2571.4},{"kind":"turn","spk":"Platon","text":"Only the good Transformers can stop this! We have to run away for now!!","start":2574.94,"end":2577.6},{"kind":"turn","spk":"Katya","text":"...and I want my child to remember it. And how Hena wanted to go back to Berdiansk. I’d suggest staying in Kyiv, and Platosha too, but Hena would say, “First we’ll go back to Berdiansk, and then we’ll see... maybe we’ll spend summers there, winters here.”","start":2578.41,"end":2597.6},{"kind":"turn","spk":"Katya","text":"There’s a second phone too, but I can’t remember the password for that one either. I’ll try one combo, then another, no idea if it’ll lock me out or not.","start":2600.42,"end":2605.3},{"kind":"turn","spk":"Katya","text":"But honestly, ever since Hena died, there’s just this lump of hurt when I think about Berdiansk.","start":2606.38,"end":2615.94},{"kind":"turn","spk":"Katya","text":"...there was this huge clock…","start":2617.0,"end":2619.3},{"kind":"turn","spk":"Ian","text":"Platosha, your steering wheel’s facing the wrong way, see?","start":2620.64,"end":2622.86},{"kind":"turn","spk":"Katya","text":"So, there was this huge clock, and the hands are like this—and Hena’s there, pushing the hand the other way, backward. I’m getting goosebumps just talking about it. After the funeral, that evening, I told the girls about this dream. And the next day...","start":2623.4,"end":2646.15},{"kind":"turn","spk":"Platon","text":"Hektor, help me, I’m driving!!!","start":2645.25,"end":2646.0},{"kind":"turn","spk":"Hek","text":"Go, brrrrr!","start":2646.0,"end":2646.6},{"kind":"turn","spk":"Katya","text":"...we woke up—it was exactly nine days—we were having breakfast, getting ready to go to the cemetery, and the girls go, “Look, the clock is moving backwards.” Then it would freeze... But before the funeral, the clock had completely stopped.","start":2646.53,"end":2671.2},{"kind":"turn","spk":"Platon","text":"Uncle Ian, I think your scooter won’t turn off!","start":2671.25,"end":2672.6},{"kind":"turn","spk":"Katya","text":"Don’t interrupt. Before the funeral, it had stopped completely. And then, the next day, it started going backwards. Then sometimes it would stop, go forward, then back again—sometimes really fast, sometimes just a little. And then I just started asking questions: “Sunshine, can you hear me?” The hand was still, and then suddenly, it moved back.","start":2672.66,"end":2701.98}]/*END*/;
  const DUR = 2704.9;

  const CONFIG = {
    AUDIO: './cherven.mp3',   // same file and cache entry as the main wall
    LOOP: true,
    START_AT: 0
  };

  const HOLD = 1.5;     // a line stays at full weight this long after its voice stops
  const DECAY = 6;      // then falls to the spoken weight over this long
  const ATTACK = 0.25;  // just enough to avoid flicker, as on the wall

  const root = document.documentElement;
  const stage = document.getElementById('stage');
  const track = document.getElementById('track');
  const audio = document.getElementById('audio');
  const gate = document.getElementById('gate');
  const panel = document.getElementById('panel');
  const scrub = document.getElementById('scrub');
  const clockVal = document.getElementById('clockVal');

  let virtualT = 0;
  const hasAudio = () => !!audio.src;
  const now = () => hasAudio() ? audio.currentTime : virtualT;
  const css = v => parseFloat(getComputedStyle(root).getPropertyValue(v));

  const items = TURNS.map(T => {
    const el = document.createElement('p');
    const verse = T.text.includes('\n');
    el.className = 'it ' + (T.kind === 'dir' ? 'dir' : 'turn') + (verse ? ' verse' : '');
    let who = null, parts = null;
    if (T.kind === 'turn') {
      who = document.createElement('span');
      who.className = 'who';
      const m = /^(.*?)(\s*\([^)]*\))?$/.exec(T.spk);
      who.append(m[1]);
      if (m[2]) {
        const note = document.createElement('i');
        note.textContent = m[2];
        who.append(note);
      }
      who.append(':');
      el.append(who, verse ? '' : ' ');
      // Verse with its own line timing (the prayer): each line is lit as it
      // is recited and the column follows the line, not the block.
      if (verse && Array.isArray(T.lines) && T.lines.length === T.text.split('\n').length) {
        const rows = T.text.split('\n');
        parts = rows.map((txt, k) => {
          const ln = document.createElement('span');
          ln.className = 'ln';
          ln.textContent = txt + (k < rows.length - 1 ? '\n' : '');
          el.append(ln);
          return { el: ln, start: T.lines[k], end: k < rows.length - 1 ? T.lines[k + 1] : T.end, op: -1, top: 0 };
        });
      } else {
        el.append(T.text);
      }
    } else {
      el.textContent = T.text;
    }
    el.addEventListener('click', e => {
      if (!gate.classList.contains('off')) return;
      const p = parts && parts.find(q => q.el === e.target);
      seek(p ? p.start : T.start);
    });
    track.appendChild(el);
    return { el, T, who, whoState: { op: -1 }, parts, op: -1, top: 0, h: 0 };
  });

  // Geometry is cached and only re-read when something that moves text
  // changes, not every frame.
  let dirty = true;
  function measure() {
    const em = parseFloat(getComputedStyle(track).fontSize);
    track.classList.toggle('ragged', track.clientWidth / em < 24);
    for (const it of items) {
      it.top = it.el.offsetTop; it.h = it.el.offsetHeight;
      if (it.parts) for (const p of it.parts) p.top = p.el.offsetTop;   // spans: offsetParent is #track
    }
    dirty = false;
  }
  window.addEventListener('resize', () => { dirty = true; });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { dirty = true; });

  // The last line whose voice has started. Lines are in playback order, so
  // this is a binary search, not a scan.
  function headAt(t) {
    let lo = 0, hi = items.length - 1, h = -1;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      if (items[mid].T.start <= t) { h = mid; lo = mid + 1; } else hi = mid - 1;
    }
    return h;
  }

  function weight(T, t, past, future) {
    if (t < T.start) return future;
    if (t < T.start + ATTACK) return future + (1 - future) * (t - T.start) / ATTACK;
    const off = T.end + HOLD;
    if (t < off) return 1;
    const k = Math.min((t - off) / DECAY, 1);
    return 1 - (1 - past) * (k * k * (3 - 2 * k));
  }

  let y = null, lastT = 0, lastFrame = performance.now();
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function update() {
    const raw = now();
    const t = raw - (VAL.offset || 0);
    if (document.activeElement !== scrub) scrub.value = Math.round(raw);
    clockVal.textContent = Math.floor(raw / 60) + ':' + String(Math.floor(raw % 60)).padStart(2, '0');
    if (!items.length) return;
    if (dirty) measure();

    const past = css('--past'), future = css('--future');
    const set = (o, el, w) => { if (Math.abs(w - o.op) > 0.004) { el.style.opacity = w.toFixed(3); o.op = w; } };
    for (const it of items) {
      if (!it.parts) { set(it, it.el, weight(it.T, t, past, future)); continue; }
      // the block stays opaque; its label carries the turn's weight and each
      // line carries its own, so opacities never multiply
      set(it, it.el, 1);
      set(it.whoState, it.who, weight(it.T, t, past, future));
      for (const p of it.parts) set(p, p.el, weight(p, t, past, future));
    }

    // Where the reading line should fall. A short line just sits on it; a
    // long one (the prayer, the commanders) travels up through it as it is
    // spoken, so the words being said stay near the line. That travel is
    // linear in time, which is a reading aid, not a claim of word-level sync.
    const H = stage.clientHeight;
    const h = headAt(t);
    let anchor;
    if (h < 0) anchor = items[0].top;
    else {
      const it = items[h], T = it.T;
      if (it.parts) {
        let k = 0;
        while (k + 1 < it.parts.length && it.parts[k + 1].start <= t) k++;
        anchor = t < it.parts[0].start ? it.top : it.parts[k].top;
      } else {
        const p = Math.min(Math.max((t - T.start) / Math.max(T.end - T.start, 0.5), 0), 1);
        anchor = it.top + p * Math.max(0, it.h - H * 0.28);
      }
    }
    const target = H * css('--line') - anchor;

    const frame = performance.now();
    const dt = Math.min((frame - lastFrame) / 1000, 0.25);
    lastFrame = frame;
    // A rewind (the loop restarting, or a seek back) or a jump of more than a
    // few screens snaps; everything else eases, so the column glides.
    if (y === null || reduced || t < lastT - 1 || Math.abs(target - y) > H * 3) y = target;
    else y += (target - y) * (1 - Math.exp(-dt / 0.35));
    lastT = t;
    track.style.transform = 'translate3d(-50%,' + y.toFixed(1) + 'px,0)';
  }

  // A single error must never take the display down, and rAF stalls whenever
  // the window is backgrounded, so a timer picks up the slack (CLAUDE.md §7).
  let lastTick = 0, errs = 0;
  function tick() {
    lastTick = performance.now();
    try { update(); }
    catch (err) { if (++errs < 5) console.error('cherven transcript update failed:', err); }
  }
  function loop() { tick(); requestAnimationFrame(loop); }
  setInterval(() => { if (performance.now() - lastTick > 500) tick(); }, 250);

  function seek(t) {
    t = Math.min(Math.max(t, 0), DUR);
    virtualT = t;
    if (hasAudio()) audio.currentTime = t;
  }
  scrub.addEventListener('input', () => seek(+scrub.value));

  const VAL = {};
  const bind = (id, prop, fmt, relayout, initial = true) => {
    const el = document.getElementById(id);
    const out = document.getElementById(id + 'Val');
    const push = () => {
      VAL[id] = parseFloat(el.value);
      if (prop) root.style.setProperty(prop, fmt(el.value));
      if (out) out.textContent = el.value;
      if (id === 'feather') document.body.classList.toggle('noFeather', +el.value === 0);
      if (relayout) dirty = true;
    };
    el.addEventListener('input', push);
    if (initial) push();
    else if (out) out.textContent = el.value;
  };
  // Size opens on the responsive default in :root; the slider only takes over
  // once it is moved, so a phone and a 4K wall both open sensibly.
  document.getElementById('size').value = Math.round(parseFloat(getComputedStyle(track).fontSize));
  bind('size',    '--size',    v => v + 'px', true, false);
  bind('lead',    '--lead',    v => v,        true);
  bind('measure', '--measure', v => v,        true);
  bind('line',    '--line',    v => v);
  bind('past',    '--past',    v => v);
  bind('future',  '--future',  v => v);
  bind('feather', '--feather', v => v);
  bind('offset',  null,        v => v);

  const fsEnter = root.requestFullscreen || root.webkitRequestFullscreen;
  const inFull = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
  const toggleFull = () => {
    if (!fsEnter) return;
    if (inFull()) (document.exitFullscreen || document.webkitExitFullscreen)?.call(document);
    else fsEnter.call(root);
  };
  const fsBtn = document.getElementById('fs');
  if (fsEnter) {
    fsBtn.addEventListener('click', e => { e.stopPropagation(); toggleFull(); });
    document.addEventListener('fullscreenchange', () => {
      fsBtn.textContent = inFull() ? 'Exit fullscreen' : 'Fullscreen';
      dirty = true;
    });
  } else {
    fsBtn.remove();   // iPhone Safari has no element fullscreen at all
  }
  document.getElementById('full').addEventListener('click', () => {
    toggleFull();
    panel.classList.remove('open');
  });

  function start() {
    gate.classList.add('off');
    audio.currentTime = virtualT || CONFIG.START_AT;
    audio.play().catch(() => {});
  }
  function load(file) {
    if (!file) return;
    audio.src = URL.createObjectURL(file);
    audio.loop = !!CONFIG.LOOP;
    audio.load();
    document.getElementById('gateBtn').textContent = 'Let’s go';
    document.getElementById('gateHint').textContent = '';
    document.getElementById('gateBtn').onclick = e => { e.preventDefault(); start(); };
  }
  document.getElementById('gateFile').addEventListener('change', e => load(e.target.files[0]));

  if (CONFIG.AUDIO) {
    audio.src = CONFIG.AUDIO;
    audio.loop = !!CONFIG.LOOP;
    audio.load();
    document.getElementById('gateBtn').onclick = e => { e.preventDefault(); start(); };
    gate.addEventListener('click', e => {
      if (e.target.tagName === 'LABEL' || e.target.tagName === 'INPUT') return;
      start();
    });
    const MEDIA_ERR = { 1: 'load aborted', 2: 'network error', 3: 'decode error',
                        4: 'source rejected' };
    audio.addEventListener('error', () => {
      const e = audio.error;
      document.getElementById('gateBtn').textContent = 'Select audio file';
      document.getElementById('gateHint').textContent =
        'Could not load the audio — ' +
        (e ? (MEDIA_ERR[e.code] || 'error') + ' (code ' + e.code + ')' : 'no error given') +
        ', network state ' + audio.networkState + '. Pick the file or drop it here.';
    });
  } else {
    document.getElementById('gateBtn').textContent = 'Select audio file';
    document.getElementById('gateHint').innerHTML =
      'Pick the Cherven mp3, or drop it anywhere on this window.<br>' +
      'No audio to hand? Double-click here, then press <kbd>C</kbd> and drag the position.';
  }

  ['dragenter', 'dragover'].forEach(ev => document.addEventListener(ev, e => {
    e.preventDefault(); document.body.classList.add('dragging');
  }));
  ['dragleave', 'drop'].forEach(ev => document.addEventListener(ev, e => {
    e.preventDefault(); document.body.classList.remove('dragging');
  }));
  document.addEventListener('drop', e => load(e.dataTransfer.files[0]));
  gate.addEventListener('dblclick', () => gate.classList.add('off'));

  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    const k = e.key.toLowerCase();
    if (k === 'c') panel.classList.toggle('open');
    if (k === 'f') toggleFull();
    if (e.key === 'ArrowRight') { e.preventDefault(); seek(now() + (e.shiftKey ? 60 : 10)); }
    if (e.key === 'ArrowLeft')  { e.preventDefault(); seek(now() - (e.shiftKey ? 60 : 10)); }
    if (e.code === 'Space') {
      e.preventDefault();
      if (!hasAudio()) return;
      audio.paused ? audio.play() : audio.pause();
    }
  });

  let hide;
  const wake = () => {
    document.body.classList.add('pointing');
    clearTimeout(hide);
    hide = setTimeout(() => document.body.classList.remove('pointing'), 2000);
  };
  document.addEventListener('mousemove', wake);
  document.addEventListener('touchstart', wake, { passive: true });

  loop();
})();
</script>
</body>
</html>
